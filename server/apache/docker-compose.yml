# Apache httpd doing the exact same job as ../nginx, on port 8081.
# Run both at once and diff the two config files -- that diff is the lesson.
#
# Start express first (cd ../express && npm start), then: docker compose up

services:
  httpd:
    image: httpd:2.4-alpine
    container_name: learn-apache
    ports:
      - "8081:80"
    volumes:
      # Apache has no conf.d convention in this image, so we replace the main
      # config outright. It is short on purpose: see how much you must switch on
      # by hand compared to nginx.
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      # Same static folder as express and nginx serve. Apache calls it htdocs.
      - ../public:/usr/local/apache2/htdocs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
