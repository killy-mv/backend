# Minimal Apache config, equivalent to ../nginx/nginx.conf.
#
# The first thing to notice: Apache starts with NO capabilities. Serving a
# directory, logging, and proxying are each a separate module you must load by
# hand. nginx compiles its common modules in; Apache makes you ask.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

# --- Modules ------------------------------------------------------------------
# The MPM decides the concurrency model (../README.md section 6). "event" is the
# modern one: a few processes, each with threads, plus a dedicated thread that
# parks idle keep-alive connections -- Apache's answer to nginx's event loop.
# Swap in mod_mpm_prefork.so to get the classic one-process-per-connection model.
LoadModule mpm_event_module    modules/mod_mpm_event.so

LoadModule unixd_module        modules/mod_unixd.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule headers_module      modules/mod_headers.so

# Reverse proxying is two modules: the generic engine, plus the HTTP backend.
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so

User  daemon
Group daemon

# --- Logging ------------------------------------------------------------------
# Straight to the container's stdout/stderr so `docker compose logs` works.
ErrorLog  /proc/self/fd/2
LogLevel  warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

# --- Static files -------------------------------------------------------------
TypesConfig conf/mime.types
DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

# Apache denies everything by default; access is granted per-directory.
<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    # AllowOverride None disables .htaccess. Leaving it on would make Apache
    # stat() every parent directory on EVERY request looking for one -- the
    # classic reason Apache benchmarks slower than nginx.
    AllowOverride None
    Require all granted
</Directory>

# --- Reverse proxy: /api/* -> express on the host -----------------------------
# Never act as a forward proxy for arbitrary destinations. Default is Off, but
# being explicit about it is worth the line.
ProxyRequests Off

# Pass the client's original Host header through instead of rewriting it.
ProxyPreserveHost On

ProxyPass        /api/ http://host.docker.internal:3000/api/ connectiontimeout=5 timeout=30
ProxyPassReverse /api/ http://host.docker.internal:3000/api/

# Unlike nginx, mod_proxy_http sets X-Forwarded-For and X-Forwarded-Host on its
# own, so only the proto header needs doing manually.
RequestHeader set X-Forwarded-Proto "http"
