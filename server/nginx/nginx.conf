# One server block = one virtual host. Mounted over the image's default.conf.
#
# Note what is NOT here: no request handler, no code. You declare where bytes
# come from and nginx's C event loop does the rest (../README.md section 3).

server {
    listen      80;
    server_name localhost;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Static files: nginx's fast path -------------------------------------
    # Reads straight off disk with sendfile(), never copying through userspace.
    # This is the job express is bad at.
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Reverse proxy: /api/* -> the express app ----------------------------
    # nginx terminates the client connection, opens its own to express, and
    # copies bytes between them. express never sees the real client socket.
    location /api/ {
        proxy_pass http://host.docker.internal:3000;

        # Keep-alive to the upstream needs HTTP/1.1; the default is 1.0.
        proxy_http_version 1.1;

        # Without these, express only ever sees the proxy's IP. nginx does NOT
        # add them for you -- compare with apache, where mod_proxy_http does.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Section 8: never wait forever on a dependency. /api/slow?ms=40000
        # will trip proxy_read_timeout and return 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
